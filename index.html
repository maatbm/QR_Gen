<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./assets/icon.png" />
    <link rel="stylesheet" type="text/css" href="./style.css" />
    <title>QR GEN</title>
  </head>
  <body>
    <main>
      <div class="mainDiv">
        <form id="inputUrlForm">
          <div class="inputUrlDiv">
            <label>Insert your Title (Optional)</label>
            <input
              type="text"
              placeholder="Insert here your QR Code title"
              id="inputTitle"
              autocomplete="off"
            />
          </div>
          <div class="inputUrlDiv">
            <label>Insert your URL</label>
            <input
              type="text"
              placeholder="Insert here your URL"
              id="inputUrl"
              autocomplete="off"
            />
          </div>
          <button type="submit">GENERATE QRCODE</button>
        </form>
        <div class="qrDiv" id="qrCodeDiv"></div>
        <button id="downloadButton">DOWNLOAD QRCODE</button>
      </div>
    </main>
    <script src="./lib/qrcode.min.js"></script>
    <script src="./js/genQr.js"></script>
    <script src="./js/downloadQr.js"></script>
  </body>
</html>
